; ═══════════════════════════════════════════════════════════
;  PgBouncer Configuration — Football Prediction System
; ═══════════════════════════════════════════════════════════
;
; Deploy alongside PostgreSQL to reduce connection overhead.
; App connects to port 6432 instead of 5432.


[databases]
; ── Main database pool (transaction mode) ─────────────
; For the REST API, dashboard, scheduler, and CLI scripts.
football_prediction = host=db port=5432 dbname=football_prediction \
    pool_size=20 \
    max_db_connections=50 \
    query_timeout=300

; ── ETL / batch pool (session mode) ───────────────────
; For long-running bulk inserts, feature computations, and backtesting
; that span multiple transactions.
football_prediction_etl = host=db port=5432 dbname=football_prediction \
    pool_size=5 \
    pool_mode=session \
    query_timeout=600


[pgbouncer]

; ── Network ──────────────────────────────────────────
listen_addr = 0.0.0.0
listen_port = 6432

; ── Authentication ───────────────────────────────────
; Development: trust mode (no password required inside Docker network)
; Production: switch to md5 and point at userlist.txt
auth_type = trust
; auth_type = md5
; auth_file = /etc/pgbouncer/userlist.txt

; ── Pool Mode ────────────────────────────────────────
; transaction mode: connection returned to pool after COMMIT/ROLLBACK
; Best for web APIs, dashboards, and most ORM workloads.
pool_mode = transaction

; ── Pool Sizing ──────────────────────────────────────
; Per-database pool — each entry in [databases] gets up to this many
; backend connections.  20 is enough for 100s of concurrent clients.
default_pool_size = 20

; Reserve pool — connections created when the main pool is exhausted.
; Released when load returns to normal.
reserve_pool_size = 5
reserve_pool_timeout = 5.0
; If a client waits > 5 s for a connection, a reserved slot is used.

; ── Client Limits ────────────────────────────────────
max_client_conn = 200
; Maximum concurrent client connections across all databases.
; Each ~ consumes ~4 KB of memory, so 200 ≈ 800 KB.

max_db_connections = 50
; Hard cap on total backend connections to PostgreSQL across all pools.
; Matches the sum of all pool_size + reserve_pool_size entries.

; ── Timeouts ─────────────────────────────────────────
server_idle_timeout = 600
; Close a backend connection that's been idle for 10 min.
; Frees PostgreSQL resources during low-traffic periods.

server_lifetime = 3600
; Maximum lifetime of a backend connection (1 hour).
; Pairs with application pool_recycle=3600 to ensure fresh connections.

client_idle_timeout = 0
; No client idle timeout — dashboards and long-running CLI keep
; their connections open indefinitely.

query_timeout = 300
; Max time a query can run before PgBouncer kills it (5 min).
; Should match PostgreSQL statement_timeout (set in migration 008).

query_wait_timeout = 30
; Client waits at most 30 s for a connection from the pool.
; Beyond this, the client gets an error instead of hanging forever.

; ── Transaction Settings ─────────────────────────────
; In transaction mode, SET/RESET/LISTEN are not supported.
; Ignore these:
ignore_startup_parameters = extra_float_digits

; ── TLS (optional) ──────────────────────────────────
; client_tls_sslmode = require
; client_tls_key_file = /etc/pgbouncer/server.key
; client_tls_cert_file = /etc/pgbouncer/server.crt

; ── Logging ──────────────────────────────────────────
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
; Per-interval log: SHOW STATS data every 60 s for monitoring.

; ── Admin Console ────────────────────────────────────
admin_users = pgbouncer
; Connect with: psql -h localhost -p 6432 pgbouncer -U pgbouncer
; Then: SHOW POOLS; SHOW STATS; SHOW CLIENTS; etc.
